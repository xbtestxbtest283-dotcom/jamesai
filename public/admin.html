<!doctype html><html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>James AI Admin</title><style>body{font-family:Arial,"Noto Sans Myanmar",sans-serif;background:#0b0d10;color:#fff;padding:20px}input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #333;background:#15191f;color:#fff}button{cursor:pointer}.order{border:1px solid #333;border-radius:12px;padding:15px;margin:12px 0}.order img{max-width:280px;display:block;margin:10px 0;border-radius:8px}.ok{background:#19c37d;color:#06150f}.bad{background:#ef4444}</style></head><body><h2>James AI — Payment Admin</h2><input id="secret" type="password" placeholder="Admin secret"><button onclick="load()">Load Orders</button><div id="orders"></div><script>const $=id=>document.getElementById(id);async function load(){const r=await fetch('/api/admin/orders',{headers:{'x-admin-secret':$('secret').value}});const d=await r.json();if(!r.ok){$('orders').textContent=d.error||'Error';return} $('orders').innerHTML=d.orders.length?d.orders.map(o=>`<div class="order"><b>${o.plan}</b> — ${o.price}<p>User: ${o.name||''} ${o.email||''}</p><p>Order: ${o.orderId}</p><p>TX: ${o.transactionId||'—'}</p>${o.screenshot?`<img src="${o.screenshot}">`:''}<button class="ok" onclick="activate('${o.sub}','${o.plan}')">Approve / Activate</button><button class="bad" onclick="reject('${o.sub}')">Reject</button></div>`).join(''):'<p>No pending orders.</p>'}async function activate(sub,planId){const r=await fetch('/api/admin/activate',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':$('secret').value},body:JSON.stringify({sub,planId})});alert((await r.json()).ok?'Activated':'Failed');load()}async function reject(sub){const r=await fetch('/api/admin/reject',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':$('secret').value},body:JSON.stringify({sub})});alert((await r.json()).ok?'Rejected':'Failed');load()}</script></body></html>
