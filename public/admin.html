<!doctype html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>James AI Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#0b0d10;color:#fff;padding:20px;max-width:100%;box-sizing:border-box}*{box-sizing:border-box}
input,button{padding:12px;margin:5px;border-radius:8px;border:1px solid #333;background:#15191f;color:#fff;font:inherit;max-width:100%;touch-action:manipulation;position:relative;z-index:2;pointer-events:auto}input{width:min(100%,340px)}button{min-height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
.order{border:1px solid #333;border-radius:12px;padding:15px;margin:12px 0}
.order img{max-width:280px;display:block;margin:10px 0;border-radius:8px}
.ok{background:#19c37d;color:#06150f}
.bad{background:#ef4444;color:#fff}
a{color:#60a5fa}
</style>
</head>
<body>

<h2>James AI — Payment Admin</h2>

<input id="secret" type="password" placeholder="Enter ADMIN_PAYMENT_SECRET from .env">
<button
  id="loadBtn"
  type="button"
  onclick="load()"
>
  Load Orders
</button>
<p id="status"></p>
<div id="orders"></div>

<p><a href="/downloads/JamesAI.apk" download>Download JamesAI APK</a></p>

<script>
const $ = id => document.getElementById(id);

$('loadBtn').addEventListener('click', load);
// Mobile fallback: make the action available to inline onclick as well.
window.load = load;

async function load() {
  $('status').textContent = 'Loading orders...';
  $('orders').replaceChildren();

  try {
    const r = await fetch('/api/admin/orders', {
      headers: {'x-admin-secret': $('secret').value.trim()}
    });

    const d = await r.json();

    if (!r.ok) {
      $('status').textContent = d.error || 'Request failed: ' + r.status;
      return;
    }

    $('status').textContent = '';

    if (!Array.isArray(d.orders) || d.orders.length === 0) {
      $('orders').textContent = 'No pending orders.';
      return;
    }

    d.orders.forEach(o => {
      const card = document.createElement('div');
      card.className = 'order';

      const title = document.createElement('b');
      title.textContent = `${o.type === 'credit' ? 'CREDIT ORDER' : 'PLAN ORDER'}: ${o.planId || 'Unknown plan'} — ${o.price || ''} MMK`;
      card.appendChild(title);

      const user = document.createElement('p');
      user.textContent = `User: ${o.name || ''} ${o.email || ''}`;
      card.appendChild(user);
      if (o.type === 'credit') { const details = document.createElement('p'); details.textContent = `Buyer: ${o.customerName || ''} · Phone: ${o.phone || ''} · Credits: ${o.credits || 0}`; card.appendChild(details); }

      const order = document.createElement('p');
      order.textContent = `Order: ${o.orderId || ''}`;
      card.appendChild(order);

      const orderStatus = document.createElement('p');
      orderStatus.textContent = `Status: ${o.status || 'unknown'}`;
      card.appendChild(orderStatus);

      const tx = document.createElement('p');
      tx.textContent = `TX: ${o.transactionId || '—'}`;
      card.appendChild(tx);

      if (o.screenshot) {
        const img = document.createElement('img');
        img.src = o.screenshot;
        img.alt = 'Payment screenshot';
        card.appendChild(img);
      }

      const approve = document.createElement('button');
      approve.className = 'ok';
      approve.textContent = 'Approve / Activate';
      approve.addEventListener('click', () => o.type === 'credit' ? approveCredit(o.sub) : activate(o.sub, o.planId));
      card.appendChild(approve);

      const rejectBtn = document.createElement('button');
      rejectBtn.className = 'bad';
      rejectBtn.textContent = 'Reject';
      rejectBtn.addEventListener('click', () => o.type === 'credit' ? rejectCredit(o.sub) : reject(o.sub));
      card.appendChild(rejectBtn);

      $('orders').appendChild(card);
    });

  } catch (err) {
    $('status').textContent = 'Connection error: ' + err.message;
  }
}

async function approveCredit(sub) {
  try {
    const r = await fetch('/api/admin/credits/approve', {method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':$('secret').value.trim()},body:JSON.stringify({sub})});
    const d = await r.json();
    alert(r.ok && d.ok ? `Credit approved. Balance: ${d.credits}` : (d.error || 'Approval failed'));
    if (r.ok && d.ok) load();
  } catch(err) { alert('Connection error: ' + err.message); }
}
async function rejectCredit(sub) {
  try {
    const r = await fetch('/api/admin/credits/reject', {method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':$('secret').value.trim()},body:JSON.stringify({sub})});
    const d = await r.json();
    alert(r.ok && d.ok ? 'Credit order rejected' : (d.error || 'Rejection failed'));
    if (r.ok && d.ok) load();
  } catch(err) { alert('Connection error: ' + err.message); }
}

async function activate(sub, planId) {
  try {
    const r = await fetch('/api/admin/activate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-secret': $('secret').value.trim()
      },
      body: JSON.stringify({sub, planId})
    });

    const d = await r.json();
    alert(r.ok && d.ok ? 'Activated' : (d.error || 'Activation failed'));
    if (r.ok && d.ok) load();
  } catch (err) {
    alert('Connection error: ' + err.message);
  }
}

async function reject(sub) {
  try {
    const r = await fetch('/api/admin/reject', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-secret': $('secret').value.trim()
      },
      body: JSON.stringify({sub})
    });

    const d = await r.json();
    alert(r.ok && d.ok ? 'Rejected' : (d.error || 'Rejection failed'));
    if (r.ok && d.ok) load();
  } catch (err) {
    alert('Connection error: ' + err.message);
  }
}
</script>
</body>
</html>
